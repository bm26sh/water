<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Water Market 관리자</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f9ff;
    padding:30px;
}

.box{
    max-width:600px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px #ddd;
}

h1{
    color:#008cff;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:10px;
}

button{
    width:100%;
    padding:14px;
    background:#008cff;
    color:white;
    border:0;
    border-radius:10px;
    cursor:pointer;
    margin-top:8px;
}

#admin{
    display:none;
}

.product{
    margin-top:15px;
    padding:15px;
    background:#eef8ff;
    border-radius:10px;
}

.product button{
    background:#ff4b4b;
}
</style>

</head>

<body>

<div class="box">

<h1>💧 Water Market 관리자</h1>


<div id="login">

<input id="pw" type="password" placeholder="관리자 비밀번호">

<button onclick="login()">
로그인
</button>

</div>


<div id="admin">

<h2>상품 추가</h2>

<input id="name" placeholder="상품명">

<input id="description" placeholder="설명">

<input id="price" placeholder="가격">

<input id="image" placeholder="이미지(이모지 또는 주소)">


<button onclick="addProduct()">
상품 추가
</button>


<h2>상품 목록</h2>

<div id="list"></div>


</div>


</div>
<script>

async function login(){

    const password =
    document.getElementById("pw").value;


    const res = await fetch("/api/admin-login",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            password
        })
    });


    const data = await res.json();


    if(data.success){

        document.getElementById("login").style.display="none";

        document.getElementById("admin").style.display="block";

        loadProducts();

    }else{

        alert("비밀번호 오류");

    }

}




async function loadProducts(){

    const res = await fetch("/api/products");

    const products = await res.json();


    let html="";


    products.forEach(p=>{

        html+=`

        <div class="product">

        <b>${p.name}</b><br>

        ${p.description}<br>

        ${p.price}원<br>

        ${p.image || ""}

        <button onclick="deleteProduct(${p.id})">
        삭제
        </button>

        </div>

        `;

    });


    document.getElementById("list").innerHTML=html;

}





async function addProduct(){

    await fetch("/api/add-product",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            name:
            document.getElementById("name").value,

            description:
            document.getElementById("description").value,

            price:
            Number(document.getElementById("price").value),

            image:
            document.getElementById("image").value

        })

    });


    alert("상품 추가 완료");

    loadProducts();

}





async function deleteProduct(id){


    if(!confirm("삭제할까요?")){
        return;
    }


    await fetch("/api/delete-product",{

        method:"DELETE",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            id
        })

    });


    loadProducts();

}


</script>


</body>
</html>
